name: Remove legacy font token

on:
  push:
    branches:
      - agent/remove-marcellus-token
    paths:
      - ".github/workflows/remove-legacy-font-token.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-marcellus-token

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove the legacy token and add a regression test
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const cssPath = "src/styles/global.css";
          const legacy = '--display: "Marcellus", Georgia, serif;';
          const canonical = '--display: var(--gw-font-display, "Bodoni Moda", Didot, "Bodoni 72", Georgia, serif);';
          const css = readFileSync(cssPath, "utf8");
          if (!css.includes(legacy)) {
            throw new Error("Expected legacy Marcellus token was not found");
          }
          writeFileSync(cssPath, css.replace(legacy, canonical));
          writeFileSync("test/no-legacy-fonts.test.mjs", `import assert from "node:assert/strict";
          import { readdir, readFile } from "node:fs/promises";
          import test from "node:test";

          const root = new URL("../src/", import.meta.url);

          async function files(directory) {
            const entries = await readdir(directory, { withFileTypes: true });
            const nested = await Promise.all(entries.map(async (entry) => {
              const target = new URL(entry.name + (entry.isDirectory() ? "/" : ""), directory);
              return entry.isDirectory() ? files(target) : [target];
            }));
            return nested.flat();
          }

          test("legacy font families cannot return to site source", async () => {
            const sourceFiles = (await files(root)).filter((file) => /\\.(astro|css|ts|js)$/.test(file.pathname));
            const matches = [];
            for (const file of sourceFiles) {
              const content = await readFile(file, "utf8");
              if (/Marcellus/i.test(content)) matches.push(file.pathname);
            }
            assert.deepEqual(matches, []);
          });
          `);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Commit normalized typography source
        run: |
          git config user.name "greenways-ci[bot]"
          git config user.email "greenways-ci[bot]@users.noreply.github.com"
          git add src/styles/global.css test/no-legacy-fonts.test.mjs
          git commit -m "style: remove the legacy Marcellus token"
          git push origin HEAD:agent/remove-marcellus-token
