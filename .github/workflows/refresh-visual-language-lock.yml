name: Refresh visual-language lock

on:
  push:
    branches:
      - brand/voronoi-favicon-logo

permissions:
  contents: write

concurrency:
  group: refresh-visual-language-lock
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: brand/voronoi-favicon-logo
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use HTTPS for the public Git dependency
        run: git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
      - name: Refresh the exact dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit the lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git commit -m "chore: refresh visual-language lock [skip ci]"
          git push origin HEAD:brand/voronoi-favicon-logo
