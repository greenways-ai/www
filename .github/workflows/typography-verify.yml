name: Typography verify

on:
  push:
    branches:
      - agent/visual-language-typography

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out typography branch
        uses: actions/checkout@v4
        with:
          ref: agent/visual-language-typography

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize lockfile
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Commit synchronized lockfile
        run: |
          git config user.name "greenways-ci[bot]"
          git config user.email "greenways-ci[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync typography lockfile"
            git push origin HEAD:agent/visual-language-typography
          fi
