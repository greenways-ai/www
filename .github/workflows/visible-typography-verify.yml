name: Visible typography verify

on:
  push:
    branches:
      - agent/visible-typography-hierarchy

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out typography branch
        uses: actions/checkout@v4
        with:
          ref: agent/visible-typography-hierarchy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build
