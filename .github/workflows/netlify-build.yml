name: Netlify build bundle

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Verify optimized social previews
        run: |
          grep -q 'https://oss.greenways.ai/visual-language/assets/og-greenways.jpg' dist/index.html
          grep -q 'https://oss.greenways.ai/visual-language/assets/og-hestia.jpg' dist/opensource/hestia/index.html
          grep -q 'https://oss.greenways.ai/visual-language/assets/og-hoplite.jpg' dist/opensource/hoplite/index.html
          grep -q 'https://oss.greenways.ai/visual-language/assets/og-historia.jpg' dist/opensource/historia/index.html
          ! grep -R -E 'visual-language/assets/og-[^" ]+\.png' dist --include='*.html'

      - name: Upload Netlify bundle
        uses: actions/upload-artifact@v4
        with:
          name: netlify-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

      - name: Deploy production when credentials are configured
        if: github.event_name != 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::notice::NETLIFY_AUTH_TOKEN is not configured; build artifact is ready but production deploy was skipped."
            exit 0
          fi
          SITE_ID="${NETLIFY_SITE_ID:-78207d83-4e5f-42ca-8575-294957b9b5af}"
          npx -y netlify-cli@latest deploy \
            --prod \
            --dir=dist \
            --site="$SITE_ID" \
            --message="GitHub main $GITHUB_SHA" \
            --json
